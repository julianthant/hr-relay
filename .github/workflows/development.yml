name: Development

run-name: ${{ github.ref_name }}

on:
  push:
    branches: ['task/**']

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      kind: fast

  development:
    name: development
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/test
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Require every fast proof
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          PLAN: ${{ needs.checks.outputs.plan }}
          RESULTS: ${{ needs.checks.outputs.results }}
        run: |
          test "$CHECKS_RESULT" = success
          node --import tsx scripts/test/ci-plan.ts verify "$PLAN" "$RESULTS"
