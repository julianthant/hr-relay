name: Portable CI checks

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    outputs:
      static:
        value: ${{ jobs.static.result }}
      privacy:
        value: ${{ jobs.privacy.result }}
      unit:
        value: ${{ jobs.unit.result }}
      integration:
        value: ${{ jobs.integration.result }}
      architecture:
        value: ${{ jobs.architecture.result }}

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  RELAY_TEST_RAM_MB: "2048"
  RELAY_TEST_TIME_SCALE: "2.5"

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:manifest:prepare
      - run: npm run typecheck
      - run: npm run lint
      - run: npm ci
        working-directory: fast-duo
      - run: npm test
        working-directory: fast-duo
      - run: npm run lint
        working-directory: fast-duo
      - run: npm run build:manifest:check
      - run: npm run stores:catalog:check
      - run: npm run roadmap:check

  ubuntu:
    name: ubuntu ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }}
    if: ${{ fromJSON(inputs.plan).ubuntu.include[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.plan).ubuntu }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:manifest:prepare
      - uses: actions/download-artifact@v4
        with:
          name: ci-balancing
          path: scripts/test/
      - uses: actions/cache@v4
        if: matrix.suite == 'integration'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and its system libraries
        if: matrix.suite == 'integration'
        run: npx playwright install --with-deps chromium
      - run: npm run web:build
        if: matrix.suite == 'integration'
      - name: Put test temp on tmpfs
        run: |
          dir=$(mktemp -d /dev/shm/relay-tmp.XXXXXX)
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - name: Tests
        env:
          SUITE: ${{ matrix.suite }}
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: scripts/test/ci-run.sh "$SUITE" ubuntu "$SLICE" --maxWorkers=2
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: durations-ubuntu-${{ matrix.suite }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations/
          if-no-files-found: ignore
          retention-days: 14

  unit:
    name: unit
    needs: ubuntu
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected suite's runner jobs
        env:
          SELECTED: ${{ fromJSON(inputs.plan).unit }}
          RUNNER_RESULTS: ${{ needs.ubuntu.result }}
        run: |
          if [ "$SELECTED" = false ]; then
            echo "Suite not selected for this pull request."
          else
            test "$SELECTED" = true
            test "$RUNNER_RESULTS" = success
          fi

  integration:
    name: integration
    needs: ubuntu
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected suite's runner jobs
        env:
          SELECTED: ${{ fromJSON(inputs.plan).integration }}
          RUNNER_RESULTS: ${{ needs.ubuntu.result }}
        run: |
          if [ "$SELECTED" = false ]; then
            echo "Suite not selected for this pull request."
          else
            test "$SELECTED" = true
            test "$RUNNER_RESULTS" = success
          fi

  architecture:
    name: architecture
    needs: ubuntu
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected suite's runner jobs
        env:
          SELECTED: ${{ fromJSON(inputs.plan).architecture }}
          RUNNER_RESULTS: ${{ needs.ubuntu.result }}
        run: |
          if [ "$SELECTED" = false ]; then
            echo "Suite not selected for this pull request."
          else
            test "$SELECTED" = true
            test "$RUNNER_RESULTS" = "success"
          fi

  privacy:
    name: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run privacy:check
