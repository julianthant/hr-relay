name: Merge train

# Merges the latest staging into eligible PRs with auto-merge enabled.
# Only operator-authored, same-repository PRs may run generators.
# staging.yml calls it after a pull request's gate, on a push to staging and when auto-merge is enabled.
on:
  workflow_call:
    inputs:
      pr: {type: string, default: ""}
      conclusion: {type: string, default: ""}
    secrets:
      TRAIN_TOKEN: {required: true}

permissions: {}

jobs:
  train:
    if: github.event_name == 'push' || (github.event.pull_request.user.login == 'julianthant' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: merge-train
      cancel-in-progress: false
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.TRAIN_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.TRAIN_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: gh auth setup-git

      - name: Label the PR whose CI finished
        if: inputs.pr != ''
        env:
          CONCLUSION: ${{ inputs.conclusion }}
          PR: ${{ inputs.pr }}
        run: |
          case "$CONCLUSION" in
            failure) gh pr edit "$PR" --add-label train-failed ;;
            success) gh pr edit "$PR" --remove-label train-failed || true ;;
          esac

      - name: Merge staging into auto-merge PRs that lack it
        run: |
          gh pr list --base staging --state open --limit 100 \
            --json number,isDraft,headRefOid,headRepositoryOwner,isCrossRepository,author,autoMergeRequest \
            --jq '.[] | select(.isDraft == false and .isCrossRepository == false and .author.login == "julianthant" and .headRepositoryOwner.login == "${{ github.repository_owner }}" and .autoMergeRequest != null) | "\(.number) \(.headRefOid)"' |
          while read -r number head; do
            behind=$(gh api "repos/$GH_REPO/compare/$head...staging" --jq .ahead_by) || continue
            [ "$behind" = 0 ] && continue
            if err=$(gh api -X PUT "repos/$GH_REPO/pulls/$number/update-branch" -f expected_head_sha="$head" 2>&1 >/dev/null); then
              echo "Updated #$number"
              gh pr edit "$number" --remove-label merge-conflict >/dev/null 2>&1 || true
            elif grep -qi conflict <<<"$err"; then
              if node_modules/.bin/tsx scripts/build/merge-generated-conflicts.ts "$number" "$head" "$GH_REPO"; then
                gh pr edit "$number" --remove-label merge-conflict
              elif current_head=$(gh api "repos/$GH_REPO/pulls/$number" --jq .head.sha) && [ "$current_head" != "$head" ]; then
                echo "Skipped #$number: head moved"
              else
                gh pr edit "$number" --add-label merge-conflict
              fi
            else
              echo "Skipped #$number: $err"
            fi
          done
