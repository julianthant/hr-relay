name: Merge train

# Merges the latest staging into every open PR so CI always tests the real combination.
# Never checks out PR code; it only calls the GitHub API.
# CI calls it as its final job (with the PR result); a push to staging also starts it.
on:
  push:
    branches: [staging]
  workflow_call:
    inputs:
      pr: {type: string, default: ""}
      conclusion: {type: string, default: ""}
    secrets:
      TRAIN_TOKEN: {required: true}

permissions: {}

jobs:
  train:
    runs-on: ubuntu-latest
    concurrency:
      group: merge-train
      cancel-in-progress: false
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.TRAIN_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Label the PR whose CI finished
        if: inputs.pr != ''
        env:
          CONCLUSION: ${{ inputs.conclusion }}
          PR: ${{ inputs.pr }}
        run: |
          case "$CONCLUSION" in
            failure) gh pr edit "$PR" --add-label train-failed ;;
            success) gh pr edit "$PR" --remove-label train-failed || true ;;
          esac

      - name: Merge staging into every open PR that lacks it
        run: |
          # A new staging can change how a PR must be fixed, so every open PR re-runs on it,
          # whatever its labels or auto-merge state. CI's per-PR concurrency cancels the old run.
          gh pr list --base staging --state open --limit 100 \
            --json number,isDraft,headRefOid,headRepositoryOwner \
            --jq '.[] | select(.isDraft == false and .headRepositoryOwner.login == "${{ github.repository_owner }}") | "\(.number) \(.headRefOid)"' |
          while read -r number head; do
            behind=$(gh api "repos/$GH_REPO/compare/$head...staging" --jq .ahead_by) || continue
            [ "$behind" = 0 ] && continue
            if err=$(gh api -X PUT "repos/$GH_REPO/pulls/$number/update-branch" -f expected_head_sha="$head" 2>&1 >/dev/null); then
              echo "Updated #$number"
              gh pr edit "$number" --remove-label merge-conflict >/dev/null 2>&1 || true
            elif grep -qi conflict <<<"$err"; then
              gh pr edit "$number" --add-label merge-conflict
            else
              echo "Skipped #$number: $err"
            fi
          done
