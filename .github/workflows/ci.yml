name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

env:
  RELAY_TEST_RAM_MB: "2048"
  # Standard macOS runners are about 2.5x slower than an operator Mac; tests stretch their waits to match.
  RELAY_TEST_TIME_SCALE: "2.5"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:manifest:check
      - run: npm run stores:catalog:check
      - run: npm run roadmap:check

  unit:
    name: unit (macos-15)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Mount test temp on a RAM disk
        run: |
          dir=$(scripts/test/ram-tmp.sh "$RELAY_TEST_RAM_MB")
          vol=$(dirname "$dir")
          case "$(mount | grep -F " on ${vol} " || true)" in
            *noowners*) echo "RAM disk is still mounted noowners" >&2; exit 1 ;;
          esac
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - run: npm run test:unit -- --maxWorkers=2

  integration-shard:
    name: integration shard ${{ matrix.shard }}/4
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # macOS verifies a freshly downloaded Chromium.app on its first launches; pay that once here.
      - name: Time cold and warm Chromium launches
        run: >-
          node --input-type=module -e "import { chromium } from 'playwright'; import { mkdtempSync } from 'node:fs';
          import { tmpdir } from 'node:os'; import { join } from 'node:path';
          for (const label of ['cold', 'warm']) { const started = performance.now();
          const context = await chromium.launchPersistentContext(mkdtempSync(join(tmpdir(), 'warm-')), { channel: 'chromium', headless: true });
          await context.close(); console.log(label + ' Chromium launch: ' + Math.round(performance.now() - started) + ' ms'); }"
      - run: npm run web:build
      - name: Mount test temp on a RAM disk
        run: |
          dir=$(scripts/test/ram-tmp.sh "$RELAY_TEST_RAM_MB")
          vol=$(dirname "$dir")
          case "$(mount | grep -F " on ${vol} " || true)" in
            *noowners*) echo "RAM disk is still mounted noowners" >&2; exit 1 ;;
          esac
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - name: Check native browser process proofs without competing files
        if: matrix.shard == 1
        run: >-
          npm run test:integration --
          tests/backend/app/composition/dashboard/compose.worker-browser-control-process.integration.test.ts
          tests/backend/runtime/browser/onboarding-duo-provider.integration.test.ts
          --maxWorkers=1 --no-file-parallelism
      - name: Check the remaining integration shard
        if: ${{ !cancelled() }}
        run: >-
          npm run test:integration -- --shard=${{ matrix.shard }}/4 --maxWorkers=2
          --exclude=tests/backend/app/composition/dashboard/compose.worker-browser-control-process.integration.test.ts
          --exclude=tests/backend/runtime/browser/onboarding-duo-provider.integration.test.ts

  integration:
    name: integration (macos-15)
    needs: [integration-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every integration shard
        run: test "${{ needs.integration-shard.result }}" = "success"

  architecture:
    name: architecture (macos-15)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Mount test temp on a RAM disk
        run: |
          dir=$(scripts/test/ram-tmp.sh "$RELAY_TEST_RAM_MB")
          vol=$(dirname "$dir")
          case "$(mount | grep -F " on ${vol} " || true)" in
            *noowners*) echo "RAM disk is still mounted noowners" >&2; exit 1 ;;
          esac
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - run: npm run test:architecture -- --no-file-parallelism

  parity-shard:
    name: parity shard ${{ matrix.shard }}/2
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Mount test temp on a RAM disk
        run: |
          dir=$(scripts/test/ram-tmp.sh "$RELAY_TEST_RAM_MB")
          vol=$(dirname "$dir")
          case "$(mount | grep -F " on ${vol} " || true)" in
            *noowners*) echo "RAM disk is still mounted noowners" >&2; exit 1 ;;
          esac
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - run: npm run test:parity -- --shard=${{ matrix.shard }}/2 --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-results-${{ matrix.shard }}
          path: tests/parity/.output/
          include-hidden-files: true

  parity:
    name: parity
    needs: [parity-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every parity shard
        run: test "${{ needs.parity-shard.result }}" = "success"

  privacy:
    name: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run privacy:check

  release:
    name: release
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [static, unit, integration, architecture, parity, privacy]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run web:build
      - name: Mount test temp on a RAM disk
        run: |
          dir=$(scripts/test/ram-tmp.sh "$RELAY_TEST_RAM_MB")
          vol=$(dirname "$dir")
          case "$(mount | grep -F " on ${vol} " || true)" in
            *noowners*) echo "RAM disk is still mounted noowners" >&2; exit 1 ;;
          esac
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - run: npm run test:coverage
      - run: npm run test:perf
