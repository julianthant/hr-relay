name: CI

on:
  pull_request:
    branches: [staging]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  names:
    name: names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Check the pull request name
        env:
          NAMES_BASE: ${{ github.base_ref }}
          NAMES_HEAD: ${{ github.head_ref }}
          NAMES_TITLE: ${{ github.event.pull_request.title }}
        run: npm run names:check -- --branch "$NAMES_HEAD" --base "$NAMES_BASE" --title "$NAMES_TITLE"

  checks:
    needs: names
    concurrency:
      group: ci-runners
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/ci-checks.yml

  static:
    name: static
    needs: [names, checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.checks.outputs.static }}
        run: test "$RESULT" = success

  privacy:
    name: privacy
    needs: [names, checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.checks.outputs.privacy }}
        run: test "$RESULT" = success

  unit:
    name: unit
    needs: [names, checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          PIPELINE: ${{ needs.checks.result }}
          RESULT: ${{ needs.checks.outputs.unit }}
        run: |
          test "$PIPELINE" = success
          test "$RESULT" = success

  integration:
    name: integration
    needs: [names, checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.checks.outputs.integration }}
        run: test "$RESULT" = success

  architecture:
    name: architecture
    needs: [names, checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.checks.outputs.architecture }}
        run: test "$RESULT" = success


  train:
    name: merge train
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'staging' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [names, static, unit, integration, architecture, privacy]
    uses: ./.github/workflows/merge-train.yml
    with:
      pr: ${{ github.event.pull_request.number }}
      conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
    secrets:
      TRAIN_TOKEN: ${{ secrets.TRAIN_TOKEN }}
