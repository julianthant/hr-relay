name: CI

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    concurrency:
      group: ci-runners
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/ci-checks.yml

  static:
    name: static
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.checks.outputs.static }}
        run: test "$RESULT" = success

  privacy:
    name: privacy
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.checks.outputs.privacy }}
        run: test "$RESULT" = success

  unit:
    name: unit
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          PIPELINE: ${{ needs.checks.result }}
          RESULT: ${{ needs.checks.outputs.unit }}
        run: |
          test "$PIPELINE" = success
          test "$RESULT" = success

  integration:
    name: integration
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.checks.outputs.integration }}
        run: test "$RESULT" = success

  architecture:
    name: architecture
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.checks.outputs.architecture }}
        run: test "$RESULT" = success

  parity:
    name: parity
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Desktop parity is verified during full releases."

  train:
    name: merge train
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'staging' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [static, unit, integration, architecture, parity, privacy]
    uses: ./.github/workflows/merge-train.yml
    with:
      pr: ${{ github.event.pull_request.number }}
      conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
    secrets:
      TRAIN_TOKEN: ${{ secrets.TRAIN_TOKEN }}
