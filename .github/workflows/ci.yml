name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

env:
  TZ: America/Los_Angeles

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:manifest:check
      - run: npm run stores:catalog:check
      - run: npm run roadmap:check

  unit:
    name: unit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: integration
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run web:build
      - id: native
        run: |
          telemetry="$RUNNER_TEMP/integration-telemetry.jsonl"
          node --import tsx scripts/test/hosted-diagnostics.ts observe integration "$$" > "$telemetry" &
          sampler_pid=$!
          finish() {
            native_status=$?
            trap - EXIT
            set +e
            kill -TERM "$sampler_pid" 2>/dev/null
            wait "$sampler_pid"
            telemetry_status=$?
            if ! cat "$telemetry"; then telemetry_status=1; fi
            printf '{"kind":"native-diagnostic-boundary","nativeExit":%s,"telemetryExit":%s}\n' "$native_status" "$telemetry_status"
            if [ "$native_status" -ne 0 ]; then exit "$native_status"; fi
            exit "$telemetry_status"
          }
          trap finish EXIT
          npm run test:integration
      - name: Diagnose prior integration timeout files once
        if: ${{ !cancelled() && steps.native.outcome != 'skipped' }}
        run: node --import tsx scripts/test/hosted-diagnostics.ts reproduce integration

  architecture:
    name: architecture
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - id: native
        run: |
          telemetry="$RUNNER_TEMP/architecture-telemetry.jsonl"
          node --import tsx scripts/test/hosted-diagnostics.ts observe architecture "$$" > "$telemetry" &
          sampler_pid=$!
          finish() {
            native_status=$?
            trap - EXIT
            set +e
            kill -TERM "$sampler_pid" 2>/dev/null
            wait "$sampler_pid"
            telemetry_status=$?
            if ! cat "$telemetry"; then telemetry_status=1; fi
            printf '{"kind":"native-diagnostic-boundary","nativeExit":%s,"telemetryExit":%s}\n' "$native_status" "$telemetry_status"
            if [ "$native_status" -ne 0 ]; then exit "$native_status"; fi
            exit "$telemetry_status"
          }
          trap finish EXIT
          npm run test:architecture
      - name: Diagnose prior architecture timeout files once
        if: ${{ !cancelled() && steps.native.outcome != 'skipped' }}
        run: node --import tsx scripts/test/hosted-diagnostics.ts reproduce architecture

  parity:
    name: parity
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:parity

  privacy:
    name: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run privacy:check

  release:
    name: release
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [static, unit, integration, architecture, parity, privacy]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run web:build
      - run: npm run test:coverage
      - run: npm run test:perf
