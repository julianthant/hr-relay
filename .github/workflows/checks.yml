name: Checks

on:
  workflow_call:
    inputs:
      kind:
        description: Calling workflow, fast, portable, release or full.
        required: true
        type: string
    outputs:
      plan:
        description: Selected check plan.
        value: ${{ jobs.changes.outputs.plan }}
      results:
        description: Job results for the caller's proof gate.
        value: ${{ toJSON(jobs) }}
      coverage-result:
        description: Full coverage merge and threshold result.
        value: ${{ jobs.coverage.result }}

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  RELAY_TEST_RAM_MB: "2048"
  RELAY_TEST_TIME_SCALE: "2.5"

jobs:
  changes:
    runs-on: ubuntu-slim
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      smoke-matrix: ${{ steps.smoke-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The fast plan diffs against development history; blobs past the checkout load on demand.
          fetch-depth: ${{ inputs.kind != 'fast' && 1 || 0 }}
          filter: ${{ inputs.kind == 'fast' && 'blob:none' || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - id: smoke-matrix
        run: |
          matrix=$(python3 tests/support/helpers/dashboard/smoke/smoke-lanes.py matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Find the latest successful file timings
        id: timings
        uses: actions/github-script@v9
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const policy = (command, payload) => JSON.parse(execFileSync('node', [
              '--import', 'tsx', 'scripts/test/ci-plan.ts', command, JSON.stringify(payload),
            ], { encoding: 'utf8' }));
            const registered = await github.paginate(github.rest.actions.listRepoWorkflows, { ...context.repo, per_page: 100 });
            const workflows = policy('workflows', registered.map(({ id, path }) => ({ id, path })));
            const histories = await Promise.all(workflows.map(async workflow_id => {
              const { data: { workflow_runs } } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id, status: 'success', per_page: 100,
              });
              return workflow_runs.map(({ id, created_at, conclusion }) => ({ id, created_at, conclusion }));
            }));
            for (const run_id of policy('history', { currentRunId: context.runId, runs: histories.flat() })) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id, per_page: 100,
              });
              if (policy('artifact', artifacts.map(({ name, expired }) => ({ name, expired })))) {
                core.setOutput('run', String(run_id));
                core.info(`Balancing from successful CI run ${run_id}`);
                return;
              }
            }
            core.info('No retained successful reports; using committed file timings.');
      - uses: actions/download-artifact@v8
        if: steps.timings.outputs.run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.timings.outputs.run }}
          name: ci-timings
          path: scripts/test/
      - uses: actions/upload-artifact@v7
        with:
          name: ci-balancing
          path: scripts/test/ci-durations.json
          retention-days: 14
      - name: Select affected integration tests
        id: affected
        if: inputs.kind == 'fast'
        run: |
          base=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ]; then base=$(git merge-base origin/development HEAD); fi
          plan=$(node --import tsx scripts/test/affected-tests.ts "$base" HEAD)
          node -e 'const p = JSON.parse(process.argv[1]); console.log(`core=${p.core} shards=${p.shards.length}/${p.shardCount}`); p.shards.forEach((s, i) => console.log(`shard ${i + 1}: ${s.join(" ")}`))' "$plan"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch' && inputs.kind != 'full'
        with:
          base: ${{ github.event_name == 'push' && 'development' || '' }}
          predicate-quantifier: every
          filters: |
            shared:
              - '**'
              - '!**/*.md'
              - '!tests/**/*.test.ts'
            unit:
              - 'tests/**/*.test.ts'
              - '!tests/**/*.integration.test.ts'
              - '!tests/architecture/**'
              - '!tests/perf/**'
            integration:
              - 'tests/**/*.integration.test.ts'
              - '!tests/perf/**'
            architecture:
              - '**'
              - '!**/*.md'
            smoke:
              - '{.github/workflows/checks.yml,playwright.smoke.config.ts,vite.dashboard.config.ts,config/dashboard-workflow-sources.json,package.json,package-lock.json,tsconfig.json,.node-version,scripts/build/**,src/**,tests/smoke/**,tests/support/helpers/dashboard/{smoke,served-fixtures,profiles}/**,tests/support/fixtures/{dashboard/**,dashboard-stream-seams.ts,explorer-seams.ts,intake-kernel-seams.ts,operator-command-fixtures.ts,phase1c-contract-fixtures.ts,phase1f-run-fixtures.ts,preflight-seams.ts,run-lifecycle-fixtures.ts},tests/support/helpers/{credential-keychain-process-preload.mjs,credential-keychain-fake.ts,seeded-dashboard-world.ts,admission-fixture.ts,backend/fake-worker-port.ts,backend/unused-worker-pool.ts,canonical-run-reader.ts,dashboard/static-assets.ts,registered-workflows.ts,run-integration-world.ts,synthetic-database-admission.ts,synthetic-storage-admission.ts,timeline-write-fixture.ts,write-fence-fixture.ts}}'
              - '!**/*.md'
              - '!**/*.test.ts'
      - uses: actions/github-script@v9
        id: select
        env:
          FILTERS: ${{ toJSON(steps.filter.outputs) }}
          AFFECTED: ${{ steps.affected.outputs.plan }}
          KIND: ${{ inputs.kind }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const input = {
              workflow: process.env.KIND, event: context.eventName,
              base: context.payload.pull_request?.base.ref ?? (context.eventName === 'push' ? 'development' : ''),
              head: context.payload.pull_request?.head.ref ?? context.ref.replace(/^refs\/heads\//u, ''),
              draft: context.payload.pull_request?.draft ?? false, filters: JSON.parse(process.env.FILTERS),
              ...(process.env.AFFECTED ? { affected: JSON.parse(process.env.AFFECTED) } : {}),
            };
            core.setOutput('plan', execFileSync('node', [
              '--import', 'tsx', 'scripts/test/ci-plan.ts', 'plan', JSON.stringify(input),
            ], { encoding: 'utf8' }).trim());

  lint:
    name: lint
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).lint }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Lint root with Oxlint
        run: npm run lint
      - run: npm ci
        working-directory: fast-duo
      - name: Lint Fast Duo with Oxlint
        run: npm run lint
        working-directory: fast-duo

  static:
    name: static
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Check added workflow files
        if: github.event_name == 'pull_request' && inputs.kind != 'fast'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/ci/allowed-workflows.ts "$PR_BASE_SHA" "$PR_LABELS"
      - name: Print typecheck compiler version
        run: npm run typecheck -- --version
      - run: npm run typecheck
      - run: npm ci
        working-directory: fast-duo
      - run: npm test
        working-directory: fast-duo
      - run: npm run build:observer-policy

  privacy:
    name: privacy
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run privacy:check

  ubuntu:
    needs: changes
    name: ubuntu ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }}
    if: ${{ fromJSON(needs.changes.outputs.plan).ubuntu.include[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE_FLAGS: ${{ inputs.kind == 'full' && '--coverage --no-coverage.thresholds --coverage.reporter=json' || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.plan).ubuntu }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: ci-balancing
          path: scripts/test/
      - uses: actions/cache@v6
        if: matrix.suite == 'integration'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      # ubuntu-24.04 already has Chromium's libraries. --with-deps only apt-installs extra fonts, and azure.archive.ubuntu.com stalls those debs.
      - name: Install Chromium
        if: matrix.suite == 'integration'
        run: npx playwright install chromium
      - run: npm run web:build
        if: matrix.suite == 'integration'
      - name: Set test temp directory
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          parent=/dev/shm
          if [[ "$SUITE" == unit ]]; then
            parent="$RUNNER_TEMP"
          fi
          dir=$(mktemp -d "$parent/relay-tmp.XXXXXX")
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - name: Tests
        if: matrix.files == null
        env:
          SUITE: ${{ matrix.suite }}
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          read -ra coverage <<< "$COVERAGE_FLAGS"
          scripts/test/ci-run.sh "$SUITE" ubuntu "$SLICE" --maxWorkers=3 "${coverage[@]}" ${COVERAGE_FLAGS:+--coverage.reportsDirectory="$RUNNER_TEMP/full-coverage/ubuntu"}
      - name: Affected integration tests
        if: matrix.files != null
        env:
          FILES: ${{ toJSON(matrix.files) }}
        run: |
          mapfile -t files < <(node -e 'for (const file of JSON.parse(process.env.FILES)) console.log(file)')
          npm run test:integration -- "${files[@]}" --reporter=verbose --maxWorkers=3
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: durations-ubuntu-${{ matrix.suite }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify coverage report
        if: inputs.kind == 'full'
        run: |
          test -s "$RUNNER_TEMP/full-coverage/ubuntu/coverage-final.json"
          pwd -P > "$RUNNER_TEMP/full-coverage/root"
      - uses: actions/upload-artifact@v7
        if: inputs.kind == 'full'
        with:
          name: coverage-ubuntu-${{ matrix.suite }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/full-coverage/
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: changes
    name: macOS ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }}
    if: ${{ fromJSON(needs.changes.outputs.plan).macos.include[0] != null }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      COVERAGE_FLAGS: ${{ inputs.kind == 'full' && '--coverage --no-coverage.thresholds --coverage.reporter=json' || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.plan).macos }}
    steps:
      # Spotlight indexing competes with the tests for the runner's three CPUs.
      - run: sudo mdutil -a -i off
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: ci-balancing
          path: scripts/test/
      - uses: actions/cache@v6
        id: browsers
        if: fromJSON(needs.changes.outputs.plan).integration
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-macos-15-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install browsers on cache miss
        if: steps.browsers.outcome == 'success' && steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npm run web:build
        if: matrix.suite == 'native' && fromJSON(needs.changes.outputs.plan).integration
      - name: Mount test temp on a RAM disk
        run: |
          dir=$(scripts/test/ram-tmp.sh "$RELAY_TEST_RAM_MB")
          vol=$(dirname "$dir")
          case "$(mount | grep -F " on ${vol} " || true)" in
            *noowners*) echo "RAM disk is still mounted noowners" >&2; exit 1 ;;
          esac
          sudo mdutil -i off "$vol"
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - name: Verify full Chromium installation before timed native proofs
        if: matrix.suite == 'native' && fromJSON(needs.changes.outputs.plan).integration
        timeout-minutes: 1
        run: npx tsx scripts/test/chromium-preflight.ts
      - name: Check native browser process proofs without competing files
        if: ${{ !cancelled() && matrix.suite == 'native' && fromJSON(needs.changes.outputs.plan).integration }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        # Samples machine state every 5s so a stalled proof shows whether memory, CPU or the RAM disk ran out.
        run: |
          ( while true; do
              echo "[machine] $(date -u +%T) load=$(sysctl -n vm.loadavg) $(memory_pressure | tail -1) tmp-free=$(df -m "$TMPDIR" | awk 'NR==2{print $4}')MB"
              ps -Ao pcpu=,rss=,comm= | sort -rn | head -4 | awk '{printf "[machine]   %s%% cpu %d MB %s\n", $1, $2/1024, $3}'
              sleep 5
            done ) &
          sampler=$!
          read -ra coverage <<< "$COVERAGE_FLAGS"
          set +e
          scripts/test/ci-run.sh integration serial "$SLICE" --maxWorkers=1 --no-file-parallelism "${coverage[@]}" ${COVERAGE_FLAGS:+--coverage.reportsDirectory="$RUNNER_TEMP/full-coverage/integration-serial"}
          status=$?
          kill "$sampler"
          exit "$status"
      - name: Storage upgrade files without competing files
        if: ${{ !cancelled() && matrix.suite == 'native' && fromJSON(needs.changes.outputs.plan).integration }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          read -ra coverage <<< "$COVERAGE_FLAGS"
          scripts/test/ci-run.sh integration storage "$SLICE" --maxWorkers=1 --no-file-parallelism "${coverage[@]}" ${COVERAGE_FLAGS:+--coverage.reportsDirectory="$RUNNER_TEMP/full-coverage/integration-storage"}
      - name: Native unit files
        if: ${{ !cancelled() && matrix.suite == 'native' && fromJSON(needs.changes.outputs.plan).unit }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          read -ra coverage <<< "$COVERAGE_FLAGS"
          scripts/test/ci-run.sh unit native "$SLICE" --maxWorkers=2 "${coverage[@]}" ${COVERAGE_FLAGS:+--coverage.reportsDirectory="$RUNNER_TEMP/full-coverage/unit-native"}
      - name: Native integration files
        if: ${{ !cancelled() && matrix.suite == 'native' && fromJSON(needs.changes.outputs.plan).integration }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          read -ra coverage <<< "$COVERAGE_FLAGS"
          scripts/test/ci-run.sh integration native "$SLICE" --maxWorkers=2 "${coverage[@]}" ${COVERAGE_FLAGS:+--coverage.reportsDirectory="$RUNNER_TEMP/full-coverage/integration-native"}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.suite == 'native' }}
        with:
          name: durations-macos-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify coverage reports
        if: inputs.kind == 'full'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/full-coverage"
          for group in integration-serial integration-storage unit-native integration-native; do
            if [ -f "$RUNNER_TEMP/durations/$RUNNER_OS-$group-$SHARD.json" ]; then
              test -s "$RUNNER_TEMP/full-coverage/$group/coverage-final.json"
            fi
          done
          pwd -P > "$RUNNER_TEMP/full-coverage/root"
      - uses: actions/upload-artifact@v7
        if: inputs.kind == 'full'
        with:
          name: coverage-macos-${{ matrix.shard }}
          path: ${{ runner.temp }}/full-coverage/
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: coverage
    needs: [changes, ubuntu, macos]
    if: inputs.kind == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: ${{ runner.temp }}/full-coverage
      - name: Merge coverage and enforce floors
        env:
          PLAN: ${{ needs.changes.outputs.plan }}
        run: |
          /usr/bin/time -f 'Coverage merge: %e s, peak RSS: %M KiB' \
            node --max-old-space-size=6144 --import tsx scripts/ci/full-coverage.ts "$RUNNER_TEMP/full-coverage" "$PLAN"

  unit-proofs:
    needs: [changes, ubuntu, macos]
    if: ${{ !cancelled() && (inputs.kind == 'release' || inputs.kind == 'full') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - env:
          PLAN: ${{ needs.changes.outputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
        run: node --import tsx scripts/test/ci-plan.ts unit-proof "$PLAN" "$RESULTS"

  integration:
    name: integration
    needs: [changes, ubuntu, macos]
    if: ${{ !cancelled() && inputs.kind != 'fast' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ fromJSON(needs.changes.outputs.plan).integration }}
          UBUNTU_RESULT: ${{ needs.ubuntu.result }}
          FULL_RELEASE: ${{ fromJSON(needs.changes.outputs.plan).fullRelease }}
          NATIVE_RESULT: ${{ needs.macos.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$SELECTED" = false ]; then
            echo "Suite not selected for this pull request."
          else
            test "$SELECTED" = true
            test "$UBUNTU_RESULT" = success
            if [ "$FULL_RELEASE" = true ]; then
              test "$NATIVE_RESULT" = success
            else
              test "$FULL_RELEASE" = false
              test "$NATIVE_RESULT" = skipped
            fi
          fi

  architecture:
    name: architecture
    needs: [changes, ubuntu]
    if: ${{ !cancelled() && inputs.kind != 'fast' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ fromJSON(needs.changes.outputs.plan).architecture }}
          UBUNTU_RESULT: ${{ needs.ubuntu.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$SELECTED" = false ]; then
            echo "Suite not selected for this pull request."
          else
            test "$SELECTED" = true
            test "$UBUNTU_RESULT" = success
          fi


  perf:
    name: perf
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).perf }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install chromium
      - run: npm run web:build
      - name: Put test temp on tmpfs
        run: |
          dir=$(mktemp -d /dev/shm/relay-tmp.XXXXXX)
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - run: npm run test:perf

  smoke:
    name: smoke (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.smoke-matrix) }}
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:observer-policy
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install chromium
      - run: npm run web:build
      - name: Put test temp on tmpfs
        run: |
          dir=$(mktemp -d /dev/shm/relay-tmp.XXXXXX)
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - name: List all smoke and gallery cases
        run: npm run --silent test:smoke -- --list --reporter=json > "$RUNNER_TEMP/smoke-list.json"
      - name: Select this lane from the complete listing
        env:
          LANE: ${{ matrix.lane }}
          SLOTS: ${{ strategy.job-total }}
        run: python3 tests/support/helpers/dashboard/smoke/smoke-lanes.py "$LANE" "$SLOTS" "$RUNNER_TEMP"
      - run: npm run test:smoke -- --test-list "$RUNNER_TEMP/smoke-tests.txt"
      - name: Verify every assigned case ran exactly once
        run: |
          jq -er --slurpfile expectedIds "$RUNNER_TEMP/smoke-expected.json" \
            -f tests/support/helpers/dashboard/smoke/verify-shard.jq tests/smoke/.output/results.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: smoke-profile-${{ matrix.lane }}
          retention-days: 7
          path: tests/smoke/.output/results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-states-${{ matrix.lane }}
          retention-days: 7
          path: tests/smoke/.output/states/
          if-no-files-found: ignore

  unit:
    name: unit
    needs: [changes, lint, static, privacy, ubuntu, integration, architecture, macos, coverage, unit-proofs, perf, smoke]
    if: ${{ !cancelled() && inputs.kind != 'fast' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Require every proof
        env:
          PLAN: ${{ needs.changes.outputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
        run: node --import tsx scripts/test/ci-plan.ts proofs "$PLAN" "$RESULTS"
      - name: Decide ci-timings publication
        id: publish
        env:
          PLAN: ${{ needs.changes.outputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          decision=$(node --import tsx scripts/test/ci-plan.ts publish "$PLAN" "$RESULTS")
          echo "upload=$decision" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: ${{ success() && steps.publish.outputs.upload == 'true' }}
        with:
          name: ci-balancing
          path: scripts/test/
      - uses: actions/download-artifact@v8
        if: ${{ success() && steps.publish.outputs.upload == 'true' }}
        with:
          pattern: durations-*
          path: ${{ runner.temp }}/durations
          merge-multiple: true
      - run: npx tsx scripts/test/ci-files.ts durations "$RUNNER_TEMP/durations"
        if: ${{ success() && steps.publish.outputs.upload == 'true' }}
      - uses: actions/upload-artifact@v7
        if: ${{ success() && steps.publish.outputs.upload == 'true' }}
        with:
          name: ci-timings
          path: scripts/test/ci-durations.json
          retention-days: 14
      - name: Verify the required unit result
        env:
          PLAN: ${{ needs.changes.outputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
        run: node --import tsx scripts/test/ci-plan.ts verify "$PLAN" "$RESULTS"
