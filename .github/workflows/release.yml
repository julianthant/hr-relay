name: Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-runners
  queue: max
  cancel-in-progress: false

env:
  RELAY_TEST_RAM_MB: "2048"
  RELAY_TEST_TIME_SCALE: "2.5"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.select.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Find the latest successful file timings
        id: timings
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const policy = (command, payload) => JSON.parse(execFileSync('node', [
              '--import', 'tsx', 'scripts/test/ci-plan.ts', command, JSON.stringify(payload),
            ], { encoding: 'utf8' }));
            const registered = await github.paginate(github.rest.actions.listRepoWorkflows, { ...context.repo, per_page: 100 });
            const workflows = policy('workflows', registered.map(({ id, path }) => ({ id, path })));
            const histories = await Promise.all(workflows.map(async workflow_id => {
              const { data: { workflow_runs } } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id, status: 'success', per_page: 100,
              });
              return workflow_runs.map(({ id, created_at, conclusion }) => ({ id, created_at, conclusion }));
            }));
            for (const run_id of policy('history', { currentRunId: context.runId, runs: histories.flat() })) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id, per_page: 100,
              });
              if (policy('artifact', artifacts.map(({ name, expired }) => ({ name, expired })))) {
                core.setOutput('run', String(run_id));
                core.info(`Balancing from successful CI run ${run_id}`);
                return;
              }
            }
            core.info('No retained successful reports; using committed file timings.');
      - uses: actions/download-artifact@v4
        if: steps.timings.outputs.run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.timings.outputs.run }}
          name: ci-timings
          path: scripts/test/
      - uses: actions/upload-artifact@v4
        with:
          name: ci-balancing
          path: scripts/test/ci-durations.json
          retention-days: 14
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            shared:
              - '**'
              - '!**/*.md'
              - '!tests/**/*.test.ts'
              - '!tests/parity/references/**'
            unit:
              - 'tests/**/*.test.ts'
              - '!tests/**/*.integration.test.ts'
              - '!tests/**/*.local.test.ts'
              - '!tests/architecture/**'
              - '!tests/parity/**'
              - '!tests/perf/**'
            integration:
              - 'tests/**/*.integration.test.ts'
              - '!tests/**/*.local.integration.test.ts'
              - '!tests/perf/**'
            architecture:
              - '**'
              - '!**/*.md'
            parity:
              - 'tests/parity/**'
              - '!**/*.md'
      - uses: actions/github-script@v7
        id: select
        env:
          FILTERS: ${{ toJSON(steps.filter.outputs) }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const input = {
              workflow: 'release', event: context.eventName,
              base: context.payload.pull_request?.base.ref ?? '', head: context.payload.pull_request?.head.ref ?? '',
              draft: context.payload.pull_request?.draft ?? false, filters: JSON.parse(process.env.FILTERS),
            };
            core.setOutput('plan', execFileSync('node', [
              '--import', 'tsx', 'scripts/test/ci-plan.ts', 'plan', JSON.stringify(input),
            ], { encoding: 'utf8' }).trim());

  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:manifest:prepare
      - run: npm run typecheck
      - run: npm run lint
      - run: npm ci
        working-directory: fast-duo
      - run: npm test
        working-directory: fast-duo
      - run: npm run lint
        working-directory: fast-duo
      - run: npm run build:manifest:check
      - run: npm run stores:catalog:check
      - run: npm run roadmap:check

  privacy:
    name: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run privacy:check

  ubuntu:
    needs: changes
    name: ubuntu ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }}
    if: ${{ fromJSON(needs.changes.outputs.plan).ubuntu.include[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.plan).ubuntu }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:manifest:prepare
      - uses: actions/download-artifact@v4
        with:
          name: ci-balancing
          path: scripts/test/
      - uses: actions/cache@v4
        if: matrix.suite == 'integration'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and its system libraries
        if: matrix.suite == 'integration'
        run: npx playwright install --with-deps chromium
      - run: npm run web:build
        if: matrix.suite == 'integration'
      - name: Put test temp on tmpfs
        run: |
          dir=$(mktemp -d /dev/shm/relay-tmp.XXXXXX)
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - name: Tests
        env:
          SUITE: ${{ matrix.suite }}
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: scripts/test/ci-run.sh "$SUITE" ubuntu "$SLICE" --maxWorkers=2
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: durations-ubuntu-${{ matrix.suite }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations/
          if-no-files-found: ignore
          retention-days: 14

  macos:
    needs: changes
    name: macOS ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }}
    if: ${{ fromJSON(needs.changes.outputs.plan).macos.include[0] != null }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.plan).macos }}
    steps:
      # Spotlight indexing competes with the tests for the runner's three CPUs.
      - run: sudo mdutil -a -i off
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:manifest:prepare
      - uses: actions/download-artifact@v4
        with:
          name: ci-balancing
          path: scripts/test/
      - uses: actions/cache@v4
        id: browsers
        if: matrix.suite == 'parity' || fromJSON(needs.changes.outputs.plan).integration
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-macos-15-playwright-${{ matrix.suite == 'parity' && 'chromium-webkit' || 'chromium' }}-${{ hashFiles('package-lock.json') }}
      - name: Install browsers on cache miss
        if: steps.browsers.outcome == 'success' && steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium ${{ matrix.suite == 'parity' && 'webkit' || '' }}
      - run: npm run web:build
        if: matrix.suite == 'native' && fromJSON(needs.changes.outputs.plan).integration
      - name: Mount test temp on a RAM disk
        run: |
          dir=$(scripts/test/ram-tmp.sh "$RELAY_TEST_RAM_MB")
          vol=$(dirname "$dir")
          case "$(mount | grep -F " on ${vol} " || true)" in
            *noowners*) echo "RAM disk is still mounted noowners" >&2; exit 1 ;;
          esac
          sudo mdutil -i off "$vol"
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - name: Verify full Chromium installation before timed native proofs
        if: matrix.suite == 'native' && fromJSON(needs.changes.outputs.plan).integration
        timeout-minutes: 1
        run: npx tsx scripts/test/chromium-preflight.ts
      - name: Check native browser process proofs without competing files
        if: ${{ !cancelled() && matrix.suite == 'native' && fromJSON(needs.changes.outputs.plan).integration }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        # Samples machine state every 5s so a stalled proof shows whether memory, CPU or the RAM disk ran out.
        run: |
          ( while true; do
              echo "[machine] $(date -u +%T) load=$(sysctl -n vm.loadavg) $(memory_pressure | tail -1) tmp-free=$(df -m "$TMPDIR" | awk 'NR==2{print $4}')MB"
              ps -Ao pcpu=,rss=,comm= | sort -rn | head -4 | awk '{printf "[machine]   %s%% cpu %d MB %s\n", $1, $2/1024, $3}'
              sleep 5
            done ) &
          sampler=$!
          set +e
          scripts/test/ci-run.sh integration serial "$SLICE" --maxWorkers=1 --no-file-parallelism
          status=$?
          kill "$sampler"
          exit "$status"
      - name: Storage upgrade files without competing files
        if: ${{ !cancelled() && matrix.suite == 'native' && fromJSON(needs.changes.outputs.plan).integration }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: scripts/test/ci-run.sh integration storage "$SLICE" --maxWorkers=1 --no-file-parallelism
      - name: Native unit files
        if: ${{ !cancelled() && matrix.suite == 'native' && fromJSON(needs.changes.outputs.plan).unit }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: scripts/test/ci-run.sh unit native "$SLICE" --maxWorkers=2
      - name: Native integration files
        if: ${{ !cancelled() && matrix.suite == 'native' && fromJSON(needs.changes.outputs.plan).integration }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: scripts/test/ci-run.sh integration native "$SLICE" --maxWorkers=2
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && matrix.suite == 'native' }}
        with:
          name: durations-macos-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations/
          if-no-files-found: ignore
          retention-days: 14
      - name: Desktop parity
        if: ${{ !cancelled() && matrix.suite == 'parity' }}
        run: npm run test:parity -- --shard=${{ matrix.shard }}/${{ matrix.shards }} --workers=2
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.suite == 'parity' }}
        with:
          name: parity-results-${{ matrix.shard }}
          path: tests/parity/.output/
          include-hidden-files: true

  windows:
    needs: changes
    name: Windows ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }}
    if: ${{ fromJSON(needs.changes.outputs.plan).windows.include[0] != null }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.plan).windows }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:manifest:prepare
      - uses: actions/download-artifact@v4
        with:
          name: ci-balancing
          path: scripts/test/
      - uses: actions/cache@v4
        if: fromJSON(needs.changes.outputs.plan).integration
        with:
          path: ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: fromJSON(needs.changes.outputs.plan).integration
        run: npx playwright install chromium
      - run: npm run web:build
        if: fromJSON(needs.changes.outputs.plan).integration
      - name: Verify full Chromium installation before timed native proofs
        if: fromJSON(needs.changes.outputs.plan).integration
        timeout-minutes: 1
        run: npx tsx scripts/test/chromium-preflight.ts
      - name: Check native browser process proofs without competing files
        if: ${{ !cancelled() && fromJSON(needs.changes.outputs.plan).integration }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: scripts/test/ci-run.sh integration serial "$SLICE" --maxWorkers=1 --no-file-parallelism
      - name: Storage upgrade files without competing files
        if: ${{ !cancelled() && fromJSON(needs.changes.outputs.plan).integration }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: scripts/test/ci-run.sh integration storage "$SLICE" --maxWorkers=1 --no-file-parallelism
      - name: Native unit files
        if: ${{ !cancelled() && fromJSON(needs.changes.outputs.plan).unit }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: scripts/test/ci-run.sh unit native "$SLICE" --maxWorkers=2
      - name: Native integration files
        if: ${{ !cancelled() && fromJSON(needs.changes.outputs.plan).integration }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: scripts/test/ci-run.sh integration native "$SLICE" --maxWorkers=2
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: durations-windows-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations/
          if-no-files-found: ignore
          retention-days: 14

  unit-proofs:
    needs: [changes, ubuntu, macos, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - env:
          PLAN: ${{ needs.changes.outputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
        run: node --import tsx scripts/test/ci-plan.ts unit-proof "$PLAN" "$RESULTS"

  integration:
    name: integration
    needs: [changes, ubuntu, macos, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ fromJSON(needs.changes.outputs.plan).integration }}
          UBUNTU_RESULT: ${{ needs.ubuntu.result }}
          FULL_RELEASE: ${{ fromJSON(needs.changes.outputs.plan).fullRelease }}
          NATIVE_RESULTS: ${{ needs.macos.result }} ${{ needs.windows.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$SELECTED" = false ]; then
            echo "Suite not selected for this pull request."
          else
            test "$SELECTED" = true
            test "$UBUNTU_RESULT" = success
            if [ "$FULL_RELEASE" = true ]; then
              test "$NATIVE_RESULTS" = "success success"
            else
              test "$FULL_RELEASE" = false
              test "$NATIVE_RESULTS" = "skipped skipped"
            fi
          fi

  architecture:
    name: architecture
    needs: [changes, ubuntu]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ fromJSON(needs.changes.outputs.plan).architecture }}
          UBUNTU_RESULT: ${{ needs.ubuntu.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$SELECTED" = false ]; then
            echo "Suite not selected for this pull request."
          else
            test "$SELECTED" = true
            test "$UBUNTU_RESULT" = success
          fi

  parity:
    name: parity
    needs: [changes, macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected suite's runner jobs
        env:
          SELECTED: ${{ fromJSON(needs.changes.outputs.plan).parity }}
          RUNNER_RESULTS: ${{ needs.macos.result }}
        run: |
          if [ "$SELECTED" = false ]; then
            echo "Suite not selected for this pull request."
          else
            test "$SELECTED" = true
            test "$RUNNER_RESULTS" = "success"
          fi

  release-batch:
    name: release batch
    if: ${{ fromJSON(needs.changes.outputs.plan).releaseBatch }}
    needs: [changes, static, privacy, unit-proofs, integration, architecture, parity]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:manifest:prepare
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-macos-15-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npm run web:build
      - name: Mount test temp on a RAM disk
        run: |
          dir=$(scripts/test/ram-tmp.sh "$RELAY_TEST_RAM_MB")
          vol=$(dirname "$dir")
          case "$(mount | grep -F " on ${vol} " || true)" in
            *noowners*) echo "RAM disk is still mounted noowners" >&2; exit 1 ;;
          esac
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - run: npm run test:coverage
      - run: npm run test:perf

  timings:
    needs: [changes, static, privacy, ubuntu, integration, architecture, parity, macos, windows, unit-proofs, release-batch]
    if: ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.plan).testJobs > 0 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - env:
          PLAN: ${{ needs.changes.outputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
        run: node --import tsx scripts/test/ci-plan.ts proofs "$PLAN" "$RESULTS"
      - uses: actions/download-artifact@v4
        with:
          name: ci-balancing
          path: scripts/test/
      - uses: actions/download-artifact@v4
        with:
          pattern: durations-*
          path: ${{ runner.temp }}/durations
          merge-multiple: true
      - run: npx tsx scripts/test/ci-files.ts durations "$RUNNER_TEMP/durations"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-timings
          path: scripts/test/ci-durations.json
          retention-days: 14

  unit:
    name: unit
    needs: [changes, static, privacy, ubuntu, integration, architecture, parity, macos, windows, unit-proofs, release-batch, timings]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - env:
          PLAN: ${{ needs.changes.outputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
        run: node --import tsx scripts/test/ci-plan.ts verify "$PLAN" "$RESULTS"

  release:
    name: release
    needs: unit
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          RESULT: ${{ needs.unit.result }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            test "$HEAD_REF" = staging
          else
            test "$EVENT" = workflow_dispatch
          fi
          test "$RESULT" = success
