name: Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    concurrency:
      group: ci-runners
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/release-checks.yml

  static:
    name: static
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.checks.outputs.static }}
        run: test "$RESULT" = success

  privacy:
    name: privacy
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.checks.outputs.privacy }}
        run: test "$RESULT" = success

  unit:
    name: unit
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          PIPELINE: ${{ needs.checks.result }}
          RESULT: ${{ needs.checks.outputs.unit }}
        run: |
          test "$PIPELINE" = success
          test "$RESULT" = success

  integration:
    name: integration
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.checks.outputs.integration }}
        run: test "$RESULT" = success

  architecture:
    name: architecture
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.checks.outputs.architecture }}
        run: test "$RESULT" = success


  release:
    name: release
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PIPELINE: ${{ needs.checks.result }}
          RESULT: ${{ needs.checks.outputs.unit }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            test "$HEAD_REF" = staging
          else
            test "$EVENT" = workflow_dispatch
          fi
          test "$PIPELINE" = success
          test "$RESULT" = success
