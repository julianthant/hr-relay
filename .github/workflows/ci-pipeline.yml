name: CI pipeline

on:
  workflow_call:
    outputs:
      static:
        value: ${{ jobs.results.outputs.static }}
      privacy:
        value: ${{ jobs.results.outputs.privacy }}
      unit:
        value: ${{ jobs.results.outputs.unit }}
      integration:
        value: ${{ jobs.results.outputs.integration }}
      architecture:
        value: ${{ jobs.results.outputs.architecture }}
      parity:
        value: ${{ jobs.results.outputs.parity }}
      release:
        value: ${{ jobs.results.outputs.release }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full-release: ${{ steps.select.outputs.full-release }}
      plan: ${{ steps.select.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Find the latest successful file timings
        id: timings
        uses: actions/github-script@v7
        with:
          script: |
            const { data: { workflow_runs: runs } } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', status: 'success', per_page: 100,
            });
            for (const run of runs) {
              if (run.id === context.runId) continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: run.id, per_page: 100,
              });
              if (artifacts.some(a => a.name === 'ci-timings' && !a.expired)) {
                core.setOutput('run', String(run.id));
                core.info(`Balancing from successful CI run ${run.id}`);
                return;
              }
            }
            core.info('No retained successful reports; using committed file timings.');
      - uses: actions/download-artifact@v4
        if: steps.timings.outputs.run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.timings.outputs.run }}
          name: ci-timings
          path: scripts/test/
      - uses: actions/upload-artifact@v4
        with:
          name: ci-balancing
          path: scripts/test/ci-durations.json
          retention-days: 14
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            shared:
              - '**'
              - '!**/*.md'
              - '!tests/**/*.test.ts'
              - '!tests/parity/references/**'
            unit:
              - 'tests/**/*.test.ts'
              - '!tests/**/*.integration.test.ts'
              - '!tests/**/*.local.test.ts'
              - '!tests/architecture/**'
              - '!tests/parity/**'
              - '!tests/perf/**'
            integration:
              - 'tests/**/*.integration.test.ts'
              - '!tests/**/*.local.integration.test.ts'
              - '!tests/perf/**'
            architecture:
              - '**'
              - '!**/*.md'
            parity:
              - 'tests/parity/**'
              - '!**/*.md'
      - uses: actions/github-script@v7
        id: select
        env:
          FILTERS: ${{ toJSON(steps.filter.outputs) }}
        with:
          script: |
            const filters = JSON.parse(process.env.FILTERS);
            const suites = ['unit', 'integration', 'architecture', 'parity'];
            if (context.eventName === 'pull_request' &&
                ['shared', ...suites].some(name => !['true', 'false'].includes(filters[name]))) {
              throw new Error('Path-filter outputs are incomplete or invalid.');
            }
            const manual = context.eventName === 'workflow_dispatch';
            const release = manual || (context.eventName === 'pull_request' &&
              context.payload.pull_request?.head.ref === 'staging' && context.payload.pull_request?.base.ref === 'main');
            const selected = Object.fromEntries(suites.map(suite => [suite,
              (suite !== 'parity' || release) && (manual || filters.shared === 'true' || filters[suite] === 'true')
            ]));
            if (!manual && context.payload.pull_request?.draft) {
              selected.integration = false;
              selected.architecture = false;
              selected.parity = false;
            }
            const jobs = (suite, shards) => Array.from({ length: shards }, (_, i) => ({ suite, shard: i + 1, shards }));
            // scripts/test/ci-files.ts balances each suite's files across its jobs by measured duration.
            // Release runs give three of the five macOS runners to parity.
            const macosShards = selected.integration ? (selected.parity ? 2 : 5) : selected.unit ? 1 : 0;
            const ubuntu = [
              ...(selected.unit ? jobs('unit', selected.integration ? 2 : 3) : []),
              ...(selected.architecture ? jobs('architecture', 2) : []),
              ...(selected.integration ? jobs('integration', 14) : []),
            ];
            const macos = release ? [...(selected.parity ? jobs('parity', 3) : []), ...jobs('native', macosShards)] : [];
            const windows = release ? jobs('native', selected.integration ? 5 : selected.unit ? 1 : 0) : [];
            const releaseBatch = context.eventName === 'pull_request' && release && selected.architecture;
            core.setOutput('full-release', String(release));
            core.setOutput('plan', JSON.stringify({ ...selected, fullRelease: release, releaseBatch,
              ubuntu: { include: ubuntu }, macos: { include: macos }, windows: { include: windows },
              testJobs: ubuntu.length + macos.length + windows.length,
            }));

  portable:
    needs: changes
    if: needs.changes.outputs.full-release == 'false'
    uses: ./.github/workflows/ci-checks.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  full-release:
    needs: changes
    if: needs.changes.outputs.full-release == 'true'
    uses: ./.github/workflows/ci-release-checks.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  results:
    needs: [changes, portable, full-release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      static: ${{ steps.validate.outputs.static }}
      privacy: ${{ steps.validate.outputs.privacy }}
      unit: ${{ steps.validate.outputs.unit }}
      integration: ${{ steps.validate.outputs.integration }}
      architecture: ${{ steps.validate.outputs.architecture }}
      parity: ${{ steps.validate.outputs.parity }}
      release: ${{ steps.validate.outputs.release }}
    steps:
      - uses: actions/github-script@v7
        id: validate
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
          PLAN: ${{ needs.changes.outputs.plan }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
          RELEASE_RESULT: ${{ needs.full-release.result }}
          PORTABLE_OUTPUTS: ${{ toJSON(needs.portable.outputs) }}
          RELEASE_OUTPUTS: ${{ toJSON(needs.full-release.outputs) }}
        with:
          script: |
            if (process.env.PLAN_RESULT !== 'success') throw new Error('CI plan failed.');
            const plan = JSON.parse(process.env.PLAN);
            const matrices = [plan.ubuntu, plan.macos, plan.windows];
            if (['unit', 'integration', 'architecture', 'parity'].some(suite => typeof plan[suite] !== 'boolean') ||
                typeof plan.fullRelease !== 'boolean' || typeof plan.releaseBatch !== 'boolean' ||
                !Number.isInteger(plan.testJobs) || plan.testJobs < 0 ||
                matrices.some(matrix => !Array.isArray(matrix?.include)) ||
                plan.testJobs !== matrices.reduce((count, matrix) => count + matrix.include.length, 0)) {
              throw new Error('CI plan is invalid.');
            }
            const chosen = plan.fullRelease ? 'RELEASE' : 'PORTABLE';
            const omitted = plan.fullRelease ? 'PORTABLE' : 'RELEASE';
            if (process.env[`${chosen}_RESULT`] !== 'success' || process.env[`${omitted}_RESULT`] !== 'skipped') {
              throw new Error('CI route did not complete as selected.');
            }
            const outputs = JSON.parse(process.env[`${chosen}_OUTPUTS`]);
            for (const suite of ['static', 'privacy', 'unit', 'integration', 'architecture']) {
              if (outputs[suite] !== 'success') throw new Error(`CI ${suite} did not succeed.`);
              core.setOutput(suite, outputs[suite]);
            }
            if (plan.fullRelease) {
              if (outputs.parity !== 'success' || outputs.release !== (plan.releaseBatch ? 'success' : 'skipped')) {
                throw new Error('Full release proofs did not complete as selected.');
              }
              core.setOutput('parity', outputs.parity);
              core.setOutput('release', outputs.release);
            } else {
              core.setOutput('parity', 'success');
              core.setOutput('release', 'skipped');
            }

  timings:
    needs: [changes, results]
    if: ${{ !cancelled() && needs.results.result == 'success' && fromJSON(needs.changes.outputs.plan).testJobs > 0 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ci-balancing
          path: scripts/test/
      - uses: actions/download-artifact@v4
        with:
          pattern: durations-*
          path: ${{ runner.temp }}/durations
          merge-multiple: true
      - run: npx tsx scripts/test/ci-files.ts durations "$RUNNER_TEMP/durations"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-timings
          path: scripts/test/ci-durations.json
          retention-days: 14
