name: Full release checks

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    outputs:
      static:
        value: ${{ jobs.portable.outputs.static }}
      privacy:
        value: ${{ jobs.portable.outputs.privacy }}
      architecture:
        value: ${{ jobs.portable.outputs.architecture }}
      unit:
        value: ${{ jobs.unit.result }}
      integration:
        value: ${{ jobs.integration.result }}
      parity:
        value: ${{ jobs.parity.result }}
      release:
        value: ${{ jobs.release.result }}

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  RELAY_TEST_RAM_MB: "2048"
  RELAY_TEST_TIME_SCALE: "2.5"

jobs:
  portable:
    uses: ./.github/workflows/ci-checks.yml
    with:
      plan: ${{ inputs.plan }}

  macos:
    name: macOS ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }}
    if: ${{ fromJSON(inputs.plan).macos.include[0] != null }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.plan).macos }}
    steps:
      # Spotlight indexing competes with the tests for the runner's three CPUs.
      - run: sudo mdutil -a -i off
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:manifest:prepare
      - uses: actions/download-artifact@v4
        with:
          name: ci-balancing
          path: scripts/test/
      - uses: actions/cache@v4
        id: browsers
        if: matrix.suite == 'parity' || fromJSON(inputs.plan).integration
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-macos-15-playwright-${{ matrix.suite == 'parity' && 'chromium-webkit' || 'chromium' }}-${{ hashFiles('package-lock.json') }}
      - name: Install browsers on cache miss
        if: steps.browsers.outcome == 'success' && steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium ${{ matrix.suite == 'parity' && 'webkit' || '' }}
      - run: npm run web:build
        if: matrix.suite == 'native' && fromJSON(inputs.plan).integration
      - name: Mount test temp on a RAM disk
        run: |
          dir=$(scripts/test/ram-tmp.sh "$RELAY_TEST_RAM_MB")
          vol=$(dirname "$dir")
          case "$(mount | grep -F " on ${vol} " || true)" in
            *noowners*) echo "RAM disk is still mounted noowners" >&2; exit 1 ;;
          esac
          sudo mdutil -i off "$vol"
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - name: Verify full Chromium installation before timed native proofs
        if: matrix.suite == 'native' && fromJSON(inputs.plan).integration
        timeout-minutes: 1
        run: npx tsx scripts/test/chromium-preflight.ts
      - name: Check native browser process proofs without competing files
        if: ${{ !cancelled() && matrix.suite == 'native' && fromJSON(inputs.plan).integration }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        # Samples machine state every 5s so a stalled proof shows whether memory, CPU or the RAM disk ran out.
        run: |
          ( while true; do
              echo "[machine] $(date -u +%T) load=$(sysctl -n vm.loadavg) $(memory_pressure | tail -1) tmp-free=$(df -m "$TMPDIR" | awk 'NR==2{print $4}')MB"
              ps -Ao pcpu=,rss=,comm= | sort -rn | head -4 | awk '{printf "[machine]   %s%% cpu %d MB %s\n", $1, $2/1024, $3}'
              sleep 5
            done ) &
          sampler=$!
          set +e
          scripts/test/ci-run.sh integration serial "$SLICE" --maxWorkers=1 --no-file-parallelism
          status=$?
          kill "$sampler"
          exit "$status"
      - name: Storage upgrade files without competing files
        if: ${{ !cancelled() && matrix.suite == 'native' && fromJSON(inputs.plan).integration }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: scripts/test/ci-run.sh integration storage "$SLICE" --maxWorkers=1 --no-file-parallelism
      - name: Native unit files
        if: ${{ !cancelled() && matrix.suite == 'native' && fromJSON(inputs.plan).unit }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: scripts/test/ci-run.sh unit native "$SLICE" --maxWorkers=2
      - name: Native integration files
        if: ${{ !cancelled() && matrix.suite == 'native' && fromJSON(inputs.plan).integration }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: scripts/test/ci-run.sh integration native "$SLICE" --maxWorkers=2
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && matrix.suite == 'native' }}
        with:
          name: durations-macos-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations/
          if-no-files-found: ignore
          retention-days: 14
      - name: Desktop parity
        if: ${{ !cancelled() && matrix.suite == 'parity' }}
        run: npm run test:parity -- --shard=${{ matrix.shard }}/${{ matrix.shards }} --workers=2
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.suite == 'parity' }}
        with:
          name: parity-results-${{ matrix.shard }}
          path: tests/parity/.output/
          include-hidden-files: true

  windows:
    name: Windows ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }}
    if: ${{ fromJSON(inputs.plan).windows.include[0] != null }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.plan).windows }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:manifest:prepare
      - uses: actions/download-artifact@v4
        with:
          name: ci-balancing
          path: scripts/test/
      - uses: actions/cache@v4
        if: fromJSON(inputs.plan).integration
        with:
          path: ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: fromJSON(inputs.plan).integration
        run: npx playwright install chromium
      - run: npm run web:build
        if: fromJSON(inputs.plan).integration
      - name: Verify full Chromium installation before timed native proofs
        if: fromJSON(inputs.plan).integration
        timeout-minutes: 1
        run: npx tsx scripts/test/chromium-preflight.ts
      - name: Check native browser process proofs without competing files
        if: ${{ !cancelled() && fromJSON(inputs.plan).integration }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: scripts/test/ci-run.sh integration serial "$SLICE" --maxWorkers=1 --no-file-parallelism
      - name: Storage upgrade files without competing files
        if: ${{ !cancelled() && fromJSON(inputs.plan).integration }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: scripts/test/ci-run.sh integration storage "$SLICE" --maxWorkers=1 --no-file-parallelism
      - name: Native unit files
        if: ${{ !cancelled() && fromJSON(inputs.plan).unit }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: scripts/test/ci-run.sh unit native "$SLICE" --maxWorkers=2
      - name: Native integration files
        if: ${{ !cancelled() && fromJSON(inputs.plan).integration }}
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.shards }}
        run: scripts/test/ci-run.sh integration native "$SLICE" --maxWorkers=2
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: durations-windows-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations/
          if-no-files-found: ignore
          retention-days: 14

  unit:
    name: unit
    needs: [portable, macos, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected suite's runner jobs
        env:
          PORTABLE_RESULT: ${{ needs.portable.outputs.unit }}
          SELECTED: ${{ fromJSON(inputs.plan).unit }}
          RUNNER_RESULTS: ${{ needs.macos.result }} ${{ needs.windows.result }}
        run: |
          test "$PORTABLE_RESULT" = success
          if [ "$SELECTED" = false ]; then
            echo "Suite not selected for this pull request."
          else
            test "$SELECTED" = true
            test "$RUNNER_RESULTS" = "success success"
          fi

  integration:
    name: integration
    needs: [portable, macos, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected suite's runner jobs
        env:
          PORTABLE_RESULT: ${{ needs.portable.outputs.integration }}
          SELECTED: ${{ fromJSON(inputs.plan).integration }}
          RUNNER_RESULTS: ${{ needs.macos.result }} ${{ needs.windows.result }}
        run: |
          test "$PORTABLE_RESULT" = success
          if [ "$SELECTED" = false ]; then
            echo "Suite not selected for this pull request."
          else
            test "$SELECTED" = true
            test "$RUNNER_RESULTS" = "success success"
          fi

  parity:
    name: parity
    needs: macos
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected suite's runner jobs
        env:
          SELECTED: ${{ fromJSON(inputs.plan).parity }}
          RUNNER_RESULTS: ${{ needs.macos.result }}
        run: |
          if [ "$SELECTED" = false ]; then
            echo "Suite not selected for this pull request."
          else
            test "$SELECTED" = true
            test "$RUNNER_RESULTS" = "success"
          fi

  release:
    name: release
    if: ${{ fromJSON(inputs.plan).releaseBatch }}
    needs: [portable, unit, integration, parity]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:manifest:prepare
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-macos-15-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npm run web:build
      - name: Mount test temp on a RAM disk
        run: |
          dir=$(scripts/test/ram-tmp.sh "$RELAY_TEST_RAM_MB")
          vol=$(dirname "$dir")
          case "$(mount | grep -F " on ${vol} " || true)" in
            *noowners*) echo "RAM disk is still mounted noowners" >&2; exit 1 ;;
          esac
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - run: npm run test:coverage
      - run: npm run test:perf
