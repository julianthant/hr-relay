name: Staging

run-name: ${{ github.event.pull_request.title || github.event.head_commit.message }}

on:
  pull_request:
    branches: [staging]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  names:
    name: names
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Check the pull request name
        env:
          NAMES_BASE: ${{ github.base_ref }}
          NAMES_HEAD: ${{ github.head_ref }}
          NAMES_TITLE: ${{ github.event.pull_request.title }}
        run: npm run names:check -- --branch "$NAMES_HEAD" --base "$NAMES_BASE" --title "$NAMES_TITLE"

  checks:
    needs: names
    concurrency:
      group: ci-runners
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/checks.yml
    with:
      kind: portable

  # Passes only on a green scheduled full run of the exact content (scripts/ci/full-run.ts).
  full-proof:
    name: full-proof
    needs: names
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
      - uses: actions/github-script@v9
        with:
          script: |
            const { fullRunProof } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/full-run.ts`);
            core.info(await fullRunProof({ github, context }));

  staging:
    name: staging
    needs: [names, checks, full-proof]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-slim
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
