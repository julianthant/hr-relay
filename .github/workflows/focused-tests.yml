name: Focused tests

# Runs the test files named in the head commit's trailers (see scripts/ci/focused-tests.sh). Not merge evidence.
on:
  push:
    branches: ['scratch/**']

permissions:
  contents: read

concurrency:
  group: focused-${{ github.ref }}
  cancel-in-progress: true

env:
  RELAY_TEST_RAM_MB: "2048"
  RELAY_TEST_TIME_SCALE: "2.5"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      files: ${{ steps.plan.outputs.files }}
      ubuntu: ${{ steps.plan.outputs.ubuntu }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
      web: ${{ steps.plan.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Read and check the requested files
        id: plan
        run: |
          fail() { echo "::error::$*"; exit 1; }
          read -ra files <<< "$(git log -1 --format='%(trailers:key=Focused-tests,valueonly,unfold)' | tr '\n' ' ')"
          os=$(git log -1 --format='%(trailers:key=Focused-os,valueonly)' | xargs)
          [ ${#files[@]} -gt 0 ] || fail "The head commit lists no Focused-tests files."
          case "$os" in ubuntu|macos|windows|both|all) ;; *) fail "Focused-os must be ubuntu, macos, windows, both (ubuntu+macos) or all, not '$os'." ;; esac
          web=false
          for file in "${files[@]}"; do
            [[ $file =~ ^tests/[A-Za-z0-9._@+/-]+$ && $file != *..* ]] || fail "$file is not a path under tests/."
            [ -f "$file" ] || fail "$file does not exist in this commit."
            [[ $file == *.integration.test.ts ]] && web=true
          done
          {
            echo "files=${files[*]}"
            echo "ubuntu=$([[ $os =~ ^(ubuntu|both|all)$ ]] && echo true || echo false)"
            echo "macos=$([[ $os =~ ^(macos|both|all)$ ]] && echo true || echo false)"
            echo "windows=$([[ $os =~ ^(windows|all)$ ]] && echo true || echo false)"
            echo "web=$web"
          } >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run privacy:check

  ubuntu:
    needs: plan
    if: needs.plan.outputs.ubuntu == 'true'
    name: ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:observer-policy
      - uses: actions/cache@v6
        if: needs.plan.outputs.web == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: needs.plan.outputs.web == 'true'
        run: npx playwright install chromium
      - run: npm run web:build
        if: needs.plan.outputs.web == 'true'
      - name: Put test temp on tmpfs
        run: |
          dir=$(mktemp -d /dev/shm/relay-tmp.XXXXXX)
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - name: Run focused tests
        env:
          FILES: ${{ needs.plan.outputs.files }}
        run: scripts/ci/focused-run.sh $FILES
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: focused-ubuntu
          path: ${{ runner.temp }}/focused/
          if-no-files-found: ignore
          retention-days: 7

  macos:
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    name: macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - run: sudo mdutil -a -i off
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:observer-policy
      - uses: actions/cache@v6
        id: browsers
        if: needs.plan.outputs.web == 'true'
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-macos-15-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install browsers on cache miss
        if: steps.browsers.outcome == 'success' && steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npm run web:build
        if: needs.plan.outputs.web == 'true'
      - name: Mount test temp on a RAM disk
        run: |
          dir=$(scripts/test/ram-tmp.sh "$RELAY_TEST_RAM_MB")
          vol=$(dirname "$dir")
          case "$(mount | grep -F " on ${vol} " || true)" in
            *noowners*) echo "RAM disk is still mounted noowners" >&2; exit 1 ;;
          esac
          sudo mdutil -i off "$vol"
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$dir" "$dir" "$dir" >> "$GITHUB_ENV"
      - name: Verify full Chromium installation before timed native proofs
        if: needs.plan.outputs.web == 'true'
        timeout-minutes: 1
        run: npx tsx scripts/test/chromium-preflight.ts
      - name: Run focused tests
        env:
          FILES: ${{ needs.plan.outputs.files }}
        run: scripts/ci/focused-run.sh $FILES
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: focused-macos
          path: ${{ runner.temp }}/focused/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:observer-policy
      - uses: actions/cache@v6
        if: needs.plan.outputs.web == 'true'
        with:
          path: ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: needs.plan.outputs.web == 'true'
        run: npx playwright install chromium
      - run: npm run web:build
        if: needs.plan.outputs.web == 'true'
      - name: Verify full Chromium installation before timed native proofs
        if: needs.plan.outputs.web == 'true'
        timeout-minutes: 1
        run: npx tsx scripts/test/chromium-preflight.ts
      - name: Run focused tests
        env:
          FILES: ${{ needs.plan.outputs.files }}
        run: scripts/ci/focused-run.sh $FILES
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: focused-windows
          path: ${{ runner.temp }}/focused/
          if-no-files-found: ignore
          retention-days: 7
