name: Production

run-name: ${{ github.event.pull_request.title || inputs.title }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      title:
        description: Run title
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: ${{ github.event_name != 'push' }}
    concurrency:
      group: release-runners
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/checks.yml
    with:
      # A staging release relies on its cut's full run; hotfixes and manual releases keep the native suite.
      kind: ${{ github.head_ref == 'staging' && 'portable' || 'release' }}

  codeql:
    if: ${{ github.event_name == 'push' || startsWith(github.head_ref, 'hotfix/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  dependencies:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm audit --omit=dev --audit-level=high

  # Passes only on a green scheduled full run of the exact content (scripts/ci/full-run.ts).
  full-proof:
    name: full-proof
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'staging' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
      - uses: actions/github-script@v9
        with:
          script: |
            const { fullRunProof } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/full-run.ts`);
            core.info(await fullRunProof({ github, context }));

  production:
    name: production
    needs: [checks, codeql, dependencies, full-proof]
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PIPELINE: ${{ needs.checks.result }}
          CODEQL: ${{ needs.codeql.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          FULL_PROOF: ${{ needs.full-proof.result }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            case "$HEAD_REF" in
              staging) test "$FULL_PROOF" = success ;;
              hotfix/*) test "$CODEQL" = success ;;
              *) exit 1 ;;
            esac
            test "$DEPENDENCIES" = success
          else
            test "$EVENT" = workflow_dispatch
          fi
          test "$PIPELINE" = success
