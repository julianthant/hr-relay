<!doctype html>
<html lang="en">
<head><link rel="icon" href="/favicon.svg" /><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>HR GPT review controls</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#181818;color:#ededed;font:13px system-ui}header{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 18px;border-bottom:1px solid #383838}header strong{margin-right:12px}label{display:flex;align-items:center;gap:8px;color:#aaa}select,a{padding:6px 9px;border:1px solid #454545;border-radius:6px;background:#242424;color:#ededed;font:inherit}a{margin-left:auto;text-decoration:none}iframe{display:block;width:100%;height:calc(100vh - 64px);min-width:1024px;min-height:720px;border:0}small{color:#aaa}
</style></head>
<body><header><strong>Preview controls <small>· synthetic data</small></strong><label>Logs <select id="review-logs" aria-label="Logs"></select></label><label>Analytics <select id="review-activity" aria-label="Analytics"></select></label><label>Notifications <select id="review-notifications" aria-label="Notifications"></select></label><a id="review-open" target="_blank" rel="noopener">Open dashboard</a></header><iframe title="Dashboard preview" id="review-frame"></iframe><script type="module" src="/surfaces/run-detail/review-controls.ts"></script></body>
</html>
