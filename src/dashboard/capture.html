<!doctype html>
<html lang="en" data-demo-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` plus the safe-area inset on the action bar: the bar is
      pinned to the bottom of the screen, which on a modern phone is where the
      home indicator lives. Without this the primary control sits under it.
      `maximum-scale` is deliberately NOT set — pinch-zoom is how someone checks
      a photograph is in focus, and taking it away to stop an input zoom is a
      trade this page refuses (its type is 16px, so nothing zooms anyway).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!--
      The title never carries the token. It is a credential in the fragment, and
      a title is read aloud by screen readers, shown in tab strips, and recorded
      by history — see `phone/capture-client.ts`.
    -->
    <title>Photograph a form</title>
  </head>
  <body data-demo-theme="light">
    <div id="capture-root"></div>
    <script type="module" src="/phone/main.tsx"></script>
  </body>
</html>
