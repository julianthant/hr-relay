<!doctype html>
<html lang="en"><title>Synthetic UCPath contacts</title><body>
<label>Empl ID <input id="search-eid" aria-label="Empl ID"></label><button id="search">Search</button>
<div id="editor" hidden></div><div id="address" hidden></div>
<script>
const fixture = __FIXTURE__;
const state = { rows: structuredClone(fixture.page.rows), paged: true, saves: 0, actions: [], modalIndex: null };
const editor = document.getElementById('editor');
const address = document.getElementById('address');
const labels = { address1: 'Address 1', address2: 'Address 2', city: 'City', state: 'State', postalCode: 'Postal', country: 'Country' };
const fields = { name: 'CONTACT_NAME', relationship: 'RELATIONSHIP', primary: 'PRIMARY_CONTACT', phone: 'PHONE', sameAddressAsEmployee: 'SAME_ADDRESS_EMPL' };
function element(tag, attributes, text) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
  if (text) node.textContent = text;
  return node;
}
function render() {
  editor.replaceChildren();
  editor.append(element('span', { id: 'PERSON_NPC_VW_EMPLID' }, fixture.page.displayedEid));
  editor.append(element('span', { id: 'PERSON_NAME_NAME' }, fixture.page.displayedName));
  editor.append(element('span', { id: '$ICField2$hrow$0' }, `1 of ${state.rows.length}`));
  const toggle = element('a', { id: '$ICField2$hviewall$0', href: '#' }, state.paged ? 'View All' : 'View 1');
  toggle.onclick = event => { event.preventDefault(); state.actions.push('view-all'); state.paged = !state.paged; render(); };
  editor.append(toggle);
  for (const row of state.paged ? state.rows.slice(0, 1) : state.rows) {
    for (const [key, field] of Object.entries(fields)) {
      const id = `EMERGENCY_CNTCT_${field}$${row.rowIndex}`;
      let node;
      if (key === 'relationship') {
        node = element('select', { id });
        for (const label of ['', 'Parent', 'Friend', 'Spouse']) {
          const option = element('option', { value: label }, label || '(Invalid Value)');
          option.selected = row.relationship === label;
          node.append(option);
        }
      } else {
        node = element('input', { id, type: typeof row[key] === 'boolean' ? 'checkbox' : 'text' });
        if (typeof row[key] === 'boolean') node.checked = row[key];
        else node.value = row[key];
      }
      const update = () => {
        state.actions.push(`${key}:${row.rowIndex}`);
        row[key] = node.type === 'checkbox' ? node.checked : node.value;
        if (key === 'relationship' && fixture.changeProtected) state.rows[0].primary = !state.rows[0].primary;
        if (key === 'name' && fixture.loseName) { row.name = ''; node.value = ''; }
        if (key !== 'name' && key !== 'phone') render();
      };
      node.addEventListener(key === 'name' || key === 'phone' ? 'input' : 'change', update);
      editor.append(node);
    }
    const edit = element('input', { id: `DERIVED_ADDR_UPDATE_ADDRESS$${row.rowIndex}`, type: 'button', value: 'Edit Address' });
    edit.onclick = () => openAddress(row.rowIndex);
    editor.append(edit);
  }
  const add = element('button', {}, 'Add a new row at row 1');
  add.onclick = () => {
    state.actions.push('add-row');
    state.rows.unshift({ name: '', relationship: '', primary: false, phone: '', sameAddressAsEmployee: false, address: null });
    state.rows.forEach((row, rowIndex) => { row.rowIndex = rowIndex; });
    state.paged = true;
    render();
  };
  const save = element('button', {}, 'Save');
  save.onclick = () => { state.saves++; throw new Error('fixture forbids Save'); };
  editor.append(add, save);
}
function openAddress(index) {
  state.actions.push(`address:${index}`);
  address.replaceChildren();
  address.hidden = false;
  state.modalIndex = index;
  for (const [key, label] of Object.entries(labels)) {
    const node = element('input', { 'aria-label': label, 'data-field': key });
    node.value = state.rows[index].address?.[key] ?? '';
    address.append(node);
  }
  const cancel = element('button', {}, 'Cancel');
  cancel.onclick = () => { address.hidden = true; state.modalIndex = null; };
  const ok = element('button', {}, 'OK');
  ok.onclick = () => {
    state.rows[index].address = Object.fromEntries([...address.querySelectorAll('input')].map(node => [node.dataset.field, node.value || null]));
    state.actions.push(`address-ok:${index}`);
    address.hidden = true;
    state.modalIndex = null;
    render();
  };
  address.append(cancel, ok);
}
document.getElementById('search').onclick = () => { editor.hidden = false; render(); };
window.contactFixtureState = state;
</script></body></html>
