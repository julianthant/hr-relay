    - text: System hosts Where a run goes when it opens each system. 0 of 9 have a test host
    - status:
      - text: Choosing between these is a per-run decision A run envelope carries the instance per system and defaults to production; a start that asks for
      - strong: test
      - text: is refused outright unless a distinct test host is configured, never quietly sent to production. This page states the hosts and sets none — a standing override here would redirect every future run with no expiry and nothing on screen to say so.
