    - region "Workflow explorer preview":
      - heading "Explorer" [level=1]
      - paragraph: Browse workflows, their steps and field sources.
      - combobox "Explorer workflow": CRM Doc Download
      - list "Workflow steps":
        - listitem:
          - heading "CRM Doc Download" [level=2]
          - text: You
          - paragraph: Finds a person's onboarding record in CRM and downloads the iDocs attached to it. CRM is read-only throughout — every change this workflow makes is to a local folder — so there is nothing a rehearsal would stop short of.
          - text: CRM search result
          - combobox "CRM search result preview": Record with attached PDFs
        - listitem:
          - heading "CRM auth" [level=2]
          - text: CRM
          - paragraph: Reach an authenticated CRM session. A replayed session is reused when a prior attempt still holds one.
          - group:
            - strong: CRM auth
            - text: Read and process CRM authentication Authenticated
        - listitem:
          - heading "Search record" [level=2]
          - text: CRM
          - paragraph: Find the onboarding record from the typed EID or email. The fuzzy search result must be confirmed against the identifier on the record, or the run throws rather than downloading somebody else's documents.
          - group:
            - strong: Search record
            - text: Read and process Email searched jordan.lee@example.com UCPath Employee ID 10000001
          - group:
            - strong: Roster identity
            - text: Read Employee ID 10000001 Roster email jordan.lee@example.com
          - group:
            - strong: CRM search
            - text: Fill
            - button "Show source for Email": Email jordan.lee@example.com
          - text: Open the matching onboarding record
        - listitem:
          - heading "Download" [level=2]
          - text: CRM
          - paragraph: Pull every iDoc attached to the record into the person's own folder under the onboarding docs directory.
          - group:
            - strong: Download
            - text: File output Documents downloaded entry-sheet.pdf, onboarding-packet.pdf
          - text: "Verify: each file re-read from the download folder. Open iDocs and enumerate attachments"
          - group:
            - strong: Attachments
            - text: Read Documents 2 Selected files entry-sheet.pdf, onboarding-packet.pdf
          - text: Download the selected PDFs
          - group:
            - strong: Download readback
            - text: Read Files entry-sheet.pdf, onboarding-packet.pdf Folder Jordan Lee
        - listitem:
          - heading "Archive" [level=2]
          - text: CRM
          - paragraph: Read the person's name off the UCPath Entry Sheet, zip the folder under it, and delete the folder. Runs sharing a parent append into one combined zip under a cross-process lock.
          - text: "Verify: the zip listed back after the move."
          - group:
            - strong: Archive identity
            - text: Read Legal name Jordan Lee Lived name Jordan Lee
          - text: Create the employee's document archive
          - group:
            - strong: Archive output
            - text: Read PDFs 2 Folder Jordan Lee Archive ZIP Jordan-Lee-documents.zip
