          - text: Attach the person's page and verify the Document Queue
        - listitem:
          - heading "Fill keywords" [level=2]
          - text: OnBase
          - paragraph: Run the Employee Lookup and fill every required keyword. The autofilled UCPath ID must equal the one this run carries, and a blank required keyword throws before the import.
          - group:
            - strong: Fill keywords
            - text: Read and process
