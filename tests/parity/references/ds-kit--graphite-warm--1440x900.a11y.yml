- main:
  - heading "The eight statuses" [level=2]
  - paragraph: "Four separating channels per status: hue, emphasis tier, icon and label. Review and Failed are the loudest solids. Done is solid green — word only. Cancelled is the same solid pill in gray. Yellow Done carries a △ count chip beside it."
  - text: Review Stopped at a gate for a decision. Nothing is written until you answer. Open Review to act. solid Failed Stopped on an error. Retry replays the same input. solid Write parked A write may or may not have landed. Never auto-retried — you resolve present or absent. dashed Done 2 Finished, but something needs your eyes — a fallback, a gap, a rejected page. The △ count beside the pill names how many. tinted Running A worker owns it right now. Only cancel is offered. tinted Queued Accepted, nothing has run. Can be bumped or cancelled. outline Cancelled You stopped it. Not an alert — a deliberate act. solid Done Finished AND read back from the system. The receipt carries the proof. solid In a dense queue the only view that proves the mapping works 8 rows
